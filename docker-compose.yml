services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      PICTOMESH_REDIS_URL: redis://redis:6379
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    command: arq backend.worker.settings.WorkerSettings
    env_file: .env
    environment:
      PICTOMESH_REDIS_URL: redis://redis:6379
      PICTOMESH_MEDIA_DIR: /app/media
    volumes:
      - media_data:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
