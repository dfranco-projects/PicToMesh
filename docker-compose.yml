services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --log-config backend/log_config.json
    env_file:
      - path: .env
        required: false
    environment:
      PICTOMESH_REDIS_URL: redis://redis:6379
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    command: arq backend.worker.settings.WorkerSettings --custom-log-dict backend.log_config.LOG_CONFIG
    env_file:
      - path: .env
        required: false
    environment:
      PICTOMESH_REDIS_URL: redis://redis:6379
      PICTOMESH_MEDIA_DIR: /app/media
      U2NET_HOME: /root/.cache/u2net  # rembg weights, kept with the other model caches
    volumes:
      - media_data:/app/media
      - model_cache:/root/.cache  # ~2.5 GB of weights (TripoSR, CLIP, Depth Anything, rembg)
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  media_data:
  model_cache:
