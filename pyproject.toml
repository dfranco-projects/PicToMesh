[project]
name = "pictomesh"
version = "0.1.0"
description = "Open-source image-to-3D mesh pipeline using modern foundation models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.136.0",
    "numpy>=2.2.6",
    "open-clip-torch>=3.3.0",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "python-multipart>=0.0.26",
    "scipy>=1.15.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "trimesh>=4.11.5",
    "uvicorn[standard]>=0.45.0",
]

[project.optional-dependencies]
single-image = [
    "einops>=0.8.2",
    "huggingface-hub>=1.11.0",
    "omegaconf>=2.3.0",
    "rembg>=2.0.69",
]
segmentation = [
    "sam-2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-forked>=1.6.0",
    "ruff>=0.15.11",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pictomesh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
