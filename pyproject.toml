[project]
name = "pictomesh"
version = "0.1.0"
description = "Open-source image-to-3D mesh pipeline using modern foundation models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "arq>=0.28.0",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "onnxruntime>=1.24.3",
    "open-clip-torch>=3.3.0",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.26",
    "scipy>=1.15.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "trimesh>=4.11.5",
    "uvicorn[standard]>=0.45.0",
]

[project.optional-dependencies]
single-image = [
    "einops>=0.8.2",
    "huggingface-hub>=1.11.0",
    "omegaconf>=2.3.0",
    "pymcubes>=0.1.6",
    "rembg>=2.0.69",
    "transformers>=4.40.0",
]
segmentation = [
    "sam-2",
]
depth = [
    "transformers>=4.40.0",
]
multi-view = [
    "addict>=2.4.0",
    "einops>=0.8.2",
    "huggingface-hub>=1.11.0",
    "omegaconf>=2.3.0",
]

[dependency-groups]
dev = [
    "aiofiles>=25.1.0",
    "anyio[trio]>=4.13.0",
    "arq>=0.28.0",
    "fakeredis[lua]>=2.35.1",
    "pre-commit>=4.6.2",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
# On Linux (Docker), use CPU-only torch — saves ~2.5GB per image
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pictomesh", "backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/pictomesh/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["slow: marks tests that use real ML services (deselect with -m 'not slow')"]
